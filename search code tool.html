<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search in Code | Search Tool</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
/* ===== BRAND COLORS ===== */
:root{
  --pink:#BF2BE2;
  --purple:#8A2BE2;
  --blue:#1E90FF;
  --dark:#111;
  --light:#ffffff;
  --gray:#f5f7fa;
}

/* ===== GLOBAL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#ffffff;
  color:#222;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 2rem;
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo img{
  width:50px;
  height:50px;
  border-radius:50%;
}

nav a{
  margin-left:2rem;
  text-decoration:none;
  color:white;
  font-weight:600;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0;
  height:2px;
  background:white;
  transition:0.3s;
}

nav a:hover::after{
  width:100%;
}

/* Hamburger menu */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  z-index:1100;
}

.hamburger span {
  display:block;
  width:25px;
  height:3px;
  margin:5px 0;
  background:white;
  transition:0.3s;
}

.hamburger.active span:nth-child(1){
  transform:rotate(45deg) translate(5px,5px);
}
.hamburger.active span:nth-child(2){
  opacity:0;
}
.hamburger.active span:nth-child(3){
  transform:rotate(-45deg) translate(5px,-5px);
}

/* Nav default desktop */
nav{
  display:flex;
  gap:2rem;
  align-items:center;
}

/* Mobile nav */
@media(max-width:1080px){
  .hamburger{display:flex;}
  nav{
    position:absolute;
    top:100%;
    right:0;
    width:100%;
    flex-direction:column;
    align-items:center;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    display:none;
    padding:1rem 0;
  }
  nav.active{display:flex;}
  nav a{
    margin:1rem 0;
    font-size:1.2rem;
  }
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  padding:5rem 2rem;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  color:white;
}

.hero h1{
  font-size:2.5rem;
  margin-bottom:1rem;
}

.hero p{
  font-size:1.2rem;
  margin-bottom:2rem;
}

.hero button{
  padding:0.8rem 2rem;
  border:none;
  border-radius:50px;
  background:white;
  color:var(--purple);
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.hero button:hover{
  background:var(--blue);
  color:white;
}

/* ===== TOOL CONTAINER ===== */
.tool-container{
  max-width:900px;
  margin:3rem auto;
  padding:2rem;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);

}

section h2{
  text-align:center;
  font-size:2rem;
  margin-bottom:2rem;
  background:linear-gradient(90deg,var(--pink),var(--blue));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* INPUT */
#searchBox{
  width:100%;
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:2px solid var(--purple);
  outline:none;
  margin-bottom:15px;
  transition:0.3s;
}

#searchBox:focus{
  border-color:var(--blue);
  box-shadow:0 0 10px rgba(30,144,255,0.3);
}

/* OPTIONS */
.options{
  display:flex;
  gap:20px;
  margin-bottom:15px;
  font-size:14px;
  color:#444;
}

.options input{
  margin-right:6px;
  accent-color:var(--pink);
  cursor:pointer;
}

/* TEXTAREA */
#editor{
  width:100%;
  height:250px;
  padding:12px;
  border-radius:10px;
  border:2px solid #ccc;
  font-family:monospace;
  resize:vertical;
}

/* OUTPUT */
#output{
  margin-top:20px;
  padding:15px;
  background:#f8f8f8;
  border-radius:10px;
  font-family:monospace;
  white-space:pre-wrap;
  border:1px solid #ddd;
  min-height:120px;
}

mark{
  background:var(--pink);
  color:white;
  padding:2px 4px;
  border-radius:4px;
}

/* CURRENT MATCH HIGHLIGHT */
mark.current {
  background:#00ff99 !important;
  color:#000;
}

/* COUNT */
#count{
  margin-top:10px;
  font-weight:bold;
  color:var(--purple);
}

/* NAVIGATION BUTTONS */
#matchNav {
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:10px;
}

#matchNav button {
  padding:6px 14px;
  border:none;
  border-radius:8px;
  background:var(--blue);
  color:white;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}

#matchNav button:hover {
  background:var(--purple);
}


#grad{
  margin-bottom:1rem;
  color:var(--purple);
}

/* ===== FOOTER ===== */
footer{
  background:#111;
  color:#aaa;
  text-align:center;
  padding:2rem;
}

footer a{
  color:var(--blue);
  text-decoration:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">
   <a href="index.html"> <img src="TDS codefx final 3 use this logo .png (2).png" alt="Logo"></a>
  </div>
  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <nav id="nav-menu">
<a href="index.html">Home</a>
<a href="index.html#tools">Tools</a>

<a href="web_index.animation.html">Animations</a>

<a href="index.html#contact">Contact</a>

  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Search in Code</h1>
  <p>Find text instantly inside your HTML, CSS or JavaScript code.</p>
</section>

<!-- TOOL SECTION -->
<section id="content">
  
  <div class="tool-container">
  <h2>Search in Code</h2> 
    <input type="text" id="searchBox" placeholder="Search in code..." />

    <div class="options">
      <label>
        <input type="checkbox" id="matchCase">
        Match Case
      </label>
      <label>
        <input type="checkbox" id="wholeWord">
        Whole Word
      </label>
    </div>

    <textarea id="editor" placeholder="Paste your HTML / CSS / JS code here..."></textarea>

    <div id="matchNav">
      <button id="prevMatch">⬆ Previous</button>
      <button id="nextMatch">⬇ Next</button>
    </div>

    <div id="count"></div>
    <div id="output"></div>

  </div>
</section>

<!-- FOOTER -->
<footer>
  © 2026 TDS CodeFx |
  <a href="privacy.html">Privacy Policy</a> |
  <a href="terms_and_condition.html">Terms & Conditions</a> |
  <a href="index.html">Home</a> 

</footer>

<script>
// Hamburger menu
const hamburger = document.getElementById('hamburger');
const navMenu = document.getElementById('nav-menu');
hamburger.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  hamburger.classList.toggle('active');
});

// SEARCH TOOL LOGIC
const searchBox = document.getElementById("searchBox");
const editor = document.getElementById("editor");
const matchCase = document.getElementById("matchCase");
const wholeWord = document.getElementById("wholeWord");
const output = document.getElementById("output");
const countBox = document.getElementById("count");
const prevBtn = document.getElementById("prevMatch");
const nextBtn = document.getElementById("nextMatch");

let matchIndices = [];
let currentMatch = -1;

// Event listeners
searchBox.addEventListener("input", runSearch);
editor.addEventListener("input", runSearch);
matchCase.addEventListener("change", runSearch);
wholeWord.addEventListener("change", runSearch);
prevBtn.addEventListener("click", () => navigateMatch(-1));
nextBtn.addEventListener("click", () => navigateMatch(1));

// MAIN SEARCH FUNCTION
function runSearch() {
  const text = editor.value;
  const word = searchBox.value.trim();
  const escapedText = escapeHTML(text);

  if (!word) {
    output.innerHTML = escapedText;
    countBox.textContent = "";
    matchIndices = [];
    currentMatch = -1;
    return;
  }

  const flags = matchCase.checked ? "g" : "gi";
  let escapedWord = escapeRegExp(word);
  if (wholeWord.checked) escapedWord = "\\b" + escapedWord + "\\b";
  const regex = new RegExp(escapedWord, flags);

  // Collect matches
  matchIndices = [];
  let match;
  while ((match = regex.exec(escapedText)) !== null) {
    matchIndices.push({start: match.index, end: match.index + match[0].length});
    if (!flags.includes("g")) break;
  }
  currentMatch = matchIndices.length > 0 ? 0 : -1;

  // Highlight all matches
  const highlighted = escapedText.replace(regex, m => `<mark>${m}</mark>`);
  output.innerHTML = highlighted;

  countBox.textContent = matchIndices.length > 0 ? matchIndices.length + " matches found" : "No match found";

  highlightCurrent();
}

// NAVIGATION FUNCTION
function navigateMatch(direction) {
  if (matchIndices.length === 0) return;
  currentMatch += direction;
  if (currentMatch < 0) currentMatch = matchIndices.length - 1;
  if (currentMatch >= matchIndices.length) currentMatch = 0;
  highlightCurrent();
}

// HIGHLIGHT CURRENT MATCH
function highlightCurrent() {
  const marks = output.querySelectorAll("mark");
  marks.forEach((m, i) => {
    m.classList.toggle("current", i === currentMatch);
  });
  if (marks[currentMatch]) {
    marks[currentMatch].scrollIntoView({behavior:"smooth", block:"center"});
  }
}

// ESCAPE REGEXP
function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

// ESCAPE HTML
function escapeHTML(str) {
  return str.replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
}
</script>
</body>
</html>
