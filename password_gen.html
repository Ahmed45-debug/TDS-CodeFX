<style>
/* ===== BRAND COLORS ===== */
:root{
  --pink:#BF2BE2;
  --purple:#8A2BE2;
  --blue:#1E90FF;
  --dark:#111;
  --light:#ffffff;
  --gray:#f5f7fa;
}

/* ===== GLOBAL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#ffffff;
  color:#222;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 2rem;
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.logo img{
  width:50px;
  height:50px;
  border-radius:50%;
}

nav a{
  margin-left:2rem;
  text-decoration:none;
  color:white;
  font-weight:600;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0;
  height:2px;
  background:white;
  transition:0.3s;
}

nav a:hover::after{
  width:100%;
}

/* Hamburger menu */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  z-index:1100;
}

.hamburger span {
  display:block;
  width:25px;
  height:3px;
  margin:5px 0;
  background:white;
  transition:0.3s;
}

.hamburger.active span:nth-child(1){
  transform:rotate(45deg) translate(5px,5px);
}
.hamburger.active span:nth-child(2){
  opacity:0;
}
.hamburger.active span:nth-child(3){
  transform:rotate(-45deg) translate(5px,-5px);
}


/* ===== DROPDOWN ===== */

.dropdown{
position:relative;
}

.dropdown-menu{
position:absolute;
top:35px;
left:0;
background:white;
min-width:180px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
display:none;
flex-direction:column;
overflow:hidden;
}

.dropdown-menu a{
color:#333;
padding:10px 15px;
text-decoration:none;
display:block;
font-weight:500;
}

.dropdown-menu a:hover{
background:#f5f5f5;
color:var(--purple);
}

/* DROPDOWN FIX */

.dropdown{
position:relative;
}

.dropdown-menu{
position:absolute;
top:40px;
left:0;
background:white;
min-width:180px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
display:none;

overflow:hidden;

}

.dropdown-menu a{
color:#333;
padding:10px 15px;
text-decoration:none;
display:block;
font-weight:500;
}

.dropdown-menu a:hover{
background:#f5f5f5;
color:var(--purple);
}

.dropdown.active .dropdown-menu{
display:block;
}




/* Nav default desktop */
nav{
  display:flex;
  gap:2rem;
  align-items:center;
}

/* Mobile nav */
@media(max-width:1080px){
  .hamburger{display:flex;}
  nav{
    position:absolute;
    top:100%;
    right:0;
    width:100%;
    flex-direction:column;
    align-items:center;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    display:none;
    padding:1rem 0;
  }
  nav.active{display:flex;}
  nav a{
    margin:1rem 0;
    font-size:1.2rem;
  }
}


@media(max-width:1080px){

.dropdown-menu{
position:static;
background:transparent;
box-shadow:none;
display:none;
}

.dropdown.active .dropdown-menu{
display:block;

.dropdown-menu a{
color:white;
}

.dropdown-menu a:hover{
background:rgba(255,255,255,0.15);
color:white;
}
}

}

/* ===== HERO ===== */

<!-- PASSWORD GENERATOR TOOL -->
<section id="content">
  <h2>Password Generator</h2>

  <div class="card" style="max-width:500px;margin:auto;">

    <label>Password Length</label>
    <input type="number" id="length" value="12" min="4" max="128" style="padding:8px;border-radius:8px;border:1px solid #ddd;">

    <label style="display:block;margin-top:10px;">
      <input type="checkbox" id="uppercase" checked> Include Uppercase Letters
    </label>

    <label style="display:block;">
      <input type="checkbox" id="lowercase" checked> Include Lowercase Letters
    </label>

    <label style="display:block;">
      <input type="checkbox" id="numbers" checked> Include Numbers
    </label>

    <label style="display:block;">
      <input type="checkbox" id="symbols" checked> Include Symbols
    </label>

    <br>

    <button onclick="generatePassword()">Generate Password</button>

    <div id="passwordOutput"
    style="margin-top:20px;background:#f5f7fa;padding:12px;border-radius:10px;font-family:monospace;font-size:18px;word-break:break-all;">
    </div>

    <button onclick="copyPassword()" style="margin-top:10px;">Copy Password</button>

  </div>
</section>

<script>
const hamburger = document.getElementById('hamburger');
const navMenu = document.getElementById('nav-menu');

hamburger.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  hamburger.classList.toggle('active');
});

function generatePassword(){

const length = parseInt(document.getElementById("length").value);
const useUpper = document.getElementById("uppercase").checked;
const useLower = document.getElementById("lowercase").checked;
const useNumbers = document.getElementById("numbers").checked;
const useSymbols = document.getElementById("symbols").checked;

const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lower = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";
const symbols = "!@#$%^&*()-_=+[]{}|;:,.<>?/~";

let charset = "";

if(useUpper) charset += upper;
if(useLower) charset += lower;
if(useNumbers) charset += numbers;
if(useSymbols) charset += symbols;

if(charset === ""){
document.getElementById("passwordOutput").textContent = "Select at least one option!";
return;
}

let password = "";

for(let i=0;i<length;i++){
const randomIndex = Math.floor(Math.random() * charset.length);
password += charset[randomIndex];
}

document.getElementById("passwordOutput").textContent = password;

}

function copyPassword(){

const password = document.getElementById("passwordOutput").textContent;

if(password === ""){
alert("Generate password first");
return;
}

navigator.clipboard.writeText(password);
alert("Password copied!");

}


/* DROPDOWN CLICK SYSTEM */

document.querySelectorAll(".dropdown > a").forEach(btn=>{

btn.addEventListener("click",function(e){

e.preventDefault()

const parent = this.parentElement

parent.classList.toggle("active")

})

})

document.addEventListener("click",function(e){

document.querySelectorAll(".dropdown").forEach(drop=>{

if(!drop.contains(e.target)){
drop.classList.remove("active")
}

})

})
</script>
